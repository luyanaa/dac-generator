CLOCK_PERIOD: 50
FP_SIZING: absolute
DRT_THREADS: 8
PL_TARGET_DENSITY_PCT: 28
FP_CORE_UTIL: 28
VDD_NETS:
- vdd
GND_NETS:
- gnd
SYNTH_POWER_DEFINE: USE_POWER_PINS
DESIGN_NAME: audiodac
VERILOG_FILES:
- dir::../../verilog/rtl/defines.v
- dir::../../verilog/rtl/audiodac.v
- dir::../../verilog/rtl/audiodac_dsmod.v
- dir::../../verilog/rtl/audiodac_fifo.v
- dir::../../verilog/rtl/audiodac_sinegen.v
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
FP_PIN_ORDER_CFG: dir::pin_order.cfg
# Buffer the ~600-fanout sinegen/LUT nets; without it a single net is
# >100ns on OR1 and the post-route STA misses 20 MHz.
RUN_POST_GPL_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_SETUP_SLACK_MARGIN: 0.1
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false
MAX_FANOUT_CONSTRAINT: 80
IO_PIN_V_LENGTH: 2
IO_PIN_H_LENGTH: 2
RUN_ANTENNA_REPAIR: false
GRT_ANTENNA_REPAIR_ITERS: 0
DRT_ANTENNA_REPAIR_ITERS: 0
RUN_IRDROP_REPORT: false
RUN_KLAYOUT_XOR: false
ERROR_ON_DISCONNECTED_PINS: false
DEDUPLICATE_CORNERS: true
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
CELL_VERILOG_MODELS: pdk_dir::libs.ref/or1_fd_sc/verilog/or1_fd_sc_bb.v
LIB:
  '*tt*': pdk_dir::libs.ref/or1_fd_sc/lib/or1_fd_sc_TT_5P0_25C.lib
  '*ss*': pdk_dir::libs.ref/or1_fd_sc/lib/or1_fd_sc_SS_4P5_85C.lib
  '*ff*': pdk_dir::libs.ref/or1_fd_sc/lib/or1_fd_sc_FF_5P5_0C.lib
STA_CORNERS:
- nom_tt_5P0_25C
- nom_ss_4P5_85C
- nom_ff_5P5_0C
ERROR_ON_LINTER_ERRORS: false
ERROR_ON_LINTER_WARNINGS: false
ERROR_ON_LINTER_TIMING_CONSTRUCTS: false
PL_MAX_DISPLACEMENT_X: 2000
PL_MAX_DISPLACEMENT_Y: 2000
PL_OPTIMIZE_MIRRORING: false
GRT_ALLOW_CONGESTION: true
DRT_OPT_ITERS: 15
ERROR_ON_KLAYOUT_DRC: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_CONFLICT_RESOLUTION: RenameCell
# PPA: 6600 -> 6200 (-11.7% area). 6000 ends with 16 DRT
# violations on the 2-layer metal2/metal3 stack.
DIE_AREA:
- 0
- 0
- 6200
- 6200
CORE_AREA:
- 20
- 60
- 6180
- 6140
SETUP_VIOLATION_CORNERS:
- ''
HOLD_VIOLATION_CORNERS:
- ''
# NOTE: with the 3 STA corners, OpenROAD.FillInsertion OOMs while
# inserting ~426k fill cells; run with -S OpenROAD.FillInsertion until the
# LibreLane fill step is fixed (the GDS then lacks fill; metrics are valid).
RUN_MAGIC_DRC: false
RUN_KLAYOUT_DRC: false
RUN_LVS: false
//sig: 'audiodac is 33k cells on OR1; magic full DRC / SPICE extraction do not '
//sig2: 'finish and the OR1 ML2 deck is already known-noisy here. GDS is the '
//sig3: deliverable; signoff deferred.
