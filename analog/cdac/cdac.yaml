# Pelgrom, measured on sky130 (40 MC runs each at 0.63 and 2.52 um^2).
a_c_pct_um: 0.234
mismatch_mode: a_c

# Mismatch structure.  The two sides of the differential array are separate
# physical capacitors: correlation_pn=0 means independent draws.  The earlier
# model reused one factor list for both sides, which made every P/N pair
# perfectly correlated and understated the differential error.  corr_len is
# an AR(1) spatial correlation length in unit indices (0 = white noise);
# gradient is a deterministic linear taper (relative, 0 = off).
mismatch_model:
  correlation_pn: 0.0
  corr_len: 0.0
  gradient: 0.0

# Acceptance gates for xcheck_mos.py.  The 8-bit model-error budget is
# 0.25 LSB: half of the 0.5 LSB DNL target is left for mismatch, TG charge
# and comparator effects.  The 4-bit array is small enough to hold 0.05 LSB.
# corner_max_error_lsb overrides max_error_lsb when the tables are measured
# at that corner (today they are tt).
model_check:
  # The Cgg/Cgb tables in this file are measured at tt.  A corner run must
  # re-measure them first; xcheck refuses to apply an ss/ff limit to tt data.
  table_corner: tt
  max_error_lsb:
    4: 0.02
    8: 0.10
  max_ramp_fc: 0.05
  max_path_fc: 0.05
  corner_max_error_lsb:
    tt: {4: 0.02, 8: 0.10}
    ss: {4: 0.02, 8: 0.10}
    ff: {4: 0.02, 8: 0.10}

# Flat-cap alternative, for the control that separates cap physics from
# array/mismatch design.  Values are the reference profile's *assumption*
# (sky130 MIM 2 fF/um^2, min area 4 um^2), not a measurement.
mim_cu_ff: 8.0
mim_area_um2: 4.0
mim_ac_pct_um: 0.3

vdd: 1.8
vref: 1.8
vcm: 0.9
vrefh: 1.8
vrefl: 0.0
# Dummy unit bottom plate: held at VCM, which is the flat-band minimum of
# the moscap curve (dC/dV = 0 there), so the dummy is a first-order constant
# reference instead of a bias-dependent one.  `vrefl` is the alternative.
dummy_mode: vcm

# Transmission gate, measured sky130 4x (Wn 5.6 / Wp 11.2 / L 0.15).
tg_wn_um: 5.6
tg_wp_um: 11.2
tg_l_um: 0.15
tg_ron_ohm: 1551.7
tg_coff_ff: 4.63
tg_coff_pex_ff: 7.708

# Top-plate parasitic floor and comparator (measured sky130 StrongArm).
c_top_ff: 20.0
cmp_sigma_uv: 500.4
cmp_offset_uv: 546.9
cmp_delay_ns: 0.101

fs_target_hz: 1000000.0
temp_c: 27.0

pdk:
  sky130:
    version: 8afc8346a57fe1ab7934ba5a6056ea8b43078e71
    corner: tt
    corner_index: libs.tech/ngspice/corners/tt.spice
    wanted: [nfet_01v8__tt, nfet_01v8__mismatch, pfet_01v8__tt, pfet_01v8__mismatch]
    nfet: sky130_fd_pr__nfet_01v8
    pfet: sky130_fd_pr__pfet_01v8
    magicrc: libs.tech/magic/sky130A.magicrc
    drc: libs.tech/klayout/drc/sky130A_mr.drc
    netgen: libs.tech/netgen/sky130A_setup.tcl
