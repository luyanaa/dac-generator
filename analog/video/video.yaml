# 8-bit 25 MS/s video-rate binary current-steering DAC (roadmap P5).
#
# Named target: 8 bit, 25 MS/s (40 ns), single-ended video output.  The array
# is 255 *identical* unit current cells grouped 1/2/4/.../128 and decoded
# straight from the binary code.  That is deliberately different from P3's
# 4+4 segmentation + DWA: it asks whether a pure binary decoder is viable at
# 8 bit when the weights are made of parallel unit cells instead of scaled
# devices, and what the binary carries cost.
#
# Cell constants are the measured gf180 values from the P3 device bench
# (`../csteer/build/cell_matrix.csv`, cascoded PMOS mirror, W/L 8/1 + 8/0.5,
# tt 25 C, 0.05-1.0 V flat window): I_unit 15.77 uA, ro 424.9 MOhm.  They are
# copied here deliberately: this leaf verifies the array/decode, not the
# device, and must not silently re-invent a cell.
name: video
bits: 8
target_msps: 25

i_unit_ua: 16.0          # rounded from the measured 15.77 uA
ro_unit: 4.249e+8        # measured, per unit cell (cascoded stack, 424.9 MOhm)

# 75 Ohm video line, double terminated at both ends -> 37.5 Ohm at the DAC.
# 255 * 16 uA * 37.5 Ohm = 153 mV full scale; the cable driver supplies the
# 1 Vpp gain.  The finite cell ro is irrelevant at this load: 425 MOhm per
# cell means the code-dependent loss is Vout/ro of each active cell, i.e. a
# 2.2e-5 relative gain error (0.006 LSB), which endpoint calibration absorbs
# completely.  An earlier revision of this file carried 425 kOhm - a 1000x
# transcription error out of the P3 bench - and concluded the opposite.
r_load: 37.5
c_load_pf: 2.0

# Per-cell current sigma.  Same Pelgrom estimate as P3: sigma_VT 3.5 mV at
# V_ov 0.2 V -> 1.75 %, rounded to 1.8 %.
cell_sigma: 0.018
vdd: 3.3

# Binary carry timing: bits launched from one register, so the skew modelled
# here is layout/clock-tree skew between bit slices, not logic.
skew_ps: 25.0
edge_ps: 20.0
settle_lsb: 0.5

pdk: gf180

# --- the device-level macro's LVS contract ---------------------------------
# All 255 cells are the *same* device set; the binary weight lives entirely in
# the digital decoder's fanout (see verilog/rtl/dac_video_dig.v), so these are
# single numbers, not per-tag widths.
cell_w: 8.0              # mirror and cascode PMOS width, um
mir_l: 1.0               # cell mirror length (the P3 measured device), um
cas_l: 0.5               # cascode length, um
sw_w: 0.5                # series supply switch, um
sw_l: 0.28

# --- rail budget -----------------------------------------------------------
# The vdd plane drop scales with the code, so it is a gain term absorbed by
# endpoint calibration; the budget is the range it may cost at full code.
# 2*drop/vov with vov 0.2 V is the current modulation it causes.
vov: 0.2
rail_gain_budget_pct: 2.0
# iout is a single-ended bus: every cell exits at one node, so the far cell's
# drain sits up to I*R/2 above the pad.  That is not a gain error (KCL still
# delivers every cell's current) and the direction only adds cascode headroom;
# the cost is that the far cells' Vds moves with the code, and through ro_unit
# that is the LSB term gated below.  25 mV is a sanity line on the geometry.
iout_drop_budget_mv: 25.0
