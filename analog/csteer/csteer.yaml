# Unit-current-steering DAC leaf (roadmap P3).
#
# Architecture: 4+4 segmentation, following 2AMLogic/gf180-current-dac.
#   * 4 MSB unary: 15 unit cells, 16 LSB each (240 LSB)
#   * 4 LSB binary: 8/4/2/1 LSB cells (15 LSB)
#   * total 255 LSB, I_LSB = 1 uA -> 255 uA full scale
#   * single-ended output into an I-V resistor (1 kOhm -> 255 mV FS)
#
# Why 4+4: unary cells are what DEM can rotate, so the unary field should cover
# the codes where linearity matters (the MSB transitions) while the binary
# field stays small enough that its mismatch does not dominate DNL.  A 6+4
# split (as in the reference) needs 63 cells with the same area and only helps
# at higher resolution.
#
# Cell mismatch is injected as a per-cell current gain error from Pelgrom, not
# from ngspice: this PDK's models have no usable statistical mismatch in this
# ngspice build (same reason as the resistor leaves).  sigma per cell is
# computed in the README from A_VT and the cell overdrive, and written to
# build/cells.json so measure.py can reproduce the DEM statistics exactly.

name: csteer
bits: 8
unary_bits: 4
binary_bits: 4

i_lsb_ua: 1.0
i_unit_ua: 16.0          # = 2**unary_bits * i_lsb

# Output I-V conversion and load.
r_iv: 1000.0
load_c_pf: 7.0

# Cell output resistance, measured by the device bench (cascoded PMOS mirror,
# flat window 0.05-1.0 V): 425 kOhm at 15.76 uA in saturation.  Binary cells
# are w parallel unit cells, so their ro is ro_unit/w.
ro_unit: 425000.0

# Per-cell current sigma (relative).  Default is the Pelgrom estimate for the
# unit cell sized below at V_ov = 0.2 V: sigma_VT = 10 mV*um / sqrt(8*1 um^2)
# = 3.5 mV -> 1.75 %, rounded to 1.8 %.  Binary cells are sized in proportion
# to their weight, so their sigma is scaled up by sqrt(weight) as well.
cell_sigma: 0.018
binary_sigma_scale: true

# Device sizing of the unit cell (used by the device bench only; the DC linearity
# bench treats cells as ideal current sources plus ro).
cell_w: 8.0
cell_l: 1.0
casc_w: 8.0
casc_l: 0.5
vdd: 3.3

pdk:
  gf180:
    model_lib: sm141064.ngspice
    design_file: design.spice
    libs: [typical]
    nfet: nfet_03v3
    pfet: pfet_03v3
    vmax: 3.3
  sky130:
    models_ok: false
    models_blocker: >-
      sky130 binned BSIM4 models cannot be selected by ngspice 44.2 here; cell
      matching and ro are therefore unverified for sky130.
    nfet: sky130_fd_pr__nfet_01v8
    pfet: sky130_fd_pr__pfet_01v8
    vmax: 3.3
